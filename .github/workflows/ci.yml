name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parser:
    name: Parser engine and bank templates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/parser/package-lock.json
      - run: npm ci
      - name: Validate templates against the schema and check the bundle is current
        run: npm run check:templates
      - name: Block unmasked fixtures
        run: npm run check:fixtures
      - run: npm run typecheck
      - name: Unit and fixture tests
        run: npm test

  app:
    name: App lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx jest

  android:
    name: Android release build and permission check
    runs-on: ubuntu-latest
    needs: [app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: app
      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain
        working-directory: app/android
      # PRD SEC-01: release builds must not be able to reach the network.
      - name: Release manifest has no INTERNET permission
        working-directory: app/android/app/build/outputs/apk/release
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt
          $AAPT dump permissions app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::Release APK requests INTERNET permission"
            exit 1
          fi
